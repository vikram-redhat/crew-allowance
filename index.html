    <!-- Theme bootstrap — runs synchronously before first paint so the page
         opens already in the user's chosen theme (no white-flash on dark).
         Mirrors the ThemeProvider logic in CrewAllowance.jsx. Keep in sync. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var effective = (saved === "dark" || saved === "light") ? saved : (prefersDark ? "dark" : "light");
          document.documentElement.dataset.theme = effective;
        } catch (e) { /* localStorage blocked — fall back to light */ }
      })();
    </script>

    <!-- Crawlable fallback content for search engines and AI engines.
         Visible only when JS is disabled, but always present in the DOM
         so Googlebot / GPTBot / ClaudeBot / PerplexityBot can index it. -->
    <noscript>
      <main style="max-width:760px;margin:40px auto;padding:24px;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#1e293b;">
        <h1>Pilot Allowance Calculator — CrewAllowance.com</h1>
        <p>
          CrewAllowance.com is an independent web tool for airline cockpit crew to verify
          their monthly allowances. Upload your end-of-month crew schedule PDF
          and your sector value Excel file, and the calculator produces a per-sector
          breakdown of the five core cockpit allowances:
        </p>
        <ul>
          <li><strong>Deadhead Allowance</strong> — paid per scheduled block hour when positioned as non-operating crew.</li>
          <li><strong>Layover Allowance</strong> — per-diem payment for stays away from home base.</li>
          <li><strong>Tail Swap Allowance</strong> — paid when aircraft registration changes between consecutive sectors within a duty.</li>
          <li><strong>Transit Halt Allowance</strong> — pro-rata payment for short ground halts between sectors.</li>
          <li><strong>Night Flying Allowance</strong> — paid for hours flown between 00:00 and 06:00.</li>
        </ul>
        <p>
          The calculator reads your home base, rank, and employee ID from your profile
          and applies the correct rates configured for your airline.
        </p>
        <p>
          <strong>This page requires JavaScript to load the calculator.</strong>
          Please enable JavaScript and refresh.
        </p>
